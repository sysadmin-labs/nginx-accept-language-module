# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP="
    set_from_accept_language \$reload_lang de en fr;"

RELOAD_SERVER="
        location /probe {
            return 200 \$reload_lang;
        }"

# A weight decides this, and only this module can weigh it: "fr" is last on
# the list and asked for with the lowest preference of the three, so a
# reload that left the variable behind -- or left it answering from a stale
# array -- cannot produce it.
RELOAD_EXPECT='fr'

reload_probe() {
	curl -s --max-time 5 -H 'Accept-Language: de;q=0.1, en;q=0.2, fr;q=0.9' \
		"http://127.0.0.1:$PORT/probe"
}
